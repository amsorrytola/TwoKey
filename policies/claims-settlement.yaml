use_case: claims-settlement
description: Autonomous motor/home/travel claims settlement. Money moves. Highest
  consequence.
risk_appetite: low
latency_budget_ms: 3000
alpha: 0.02
tau: 0.218
thresholds:
  auto_max: 0.218
  edit_max: 0.368
  two_key_max: 0.568
  human_max: 0.85
max_auto_amount:
  EUR: 2500
  INR: 200000
irreversible_actions:
- approve_payout
- deny_claim
allowed_actions:
- approve_payout
- deny_claim
- request_documents
- escalate
weights:
  static_policy: 0.26
  evidence_nli: 0.24
  trace_auditor: 0.14
  semantic_entropy: 0.14
  consequence_sim: 0.16
  prompt_guard: 0.06
edit_rules:
  clamp_to_coverage_limit: true
  redact_pii_in_payload: true
jurisdiction_overrides:
  EU:
    require_human_for:
    - deny_claim
    pii_policy: strict
    log_retention_months: 6
    basis: EU AI Act Art.12 (logging) + Art.14 (human oversight); GDPR Art.22 (automated
      decisions)
  IN:
    require_human_for: []
    pii_policy: dpdp
    log_retention_months: 12
    basis: DPDP Act 2023 + DPDP Rules 2025; IRDAI guidance on AI in claims
